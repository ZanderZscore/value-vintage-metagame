name: Update Value Vintage metagame

on:
  workflow_dispatch:
    inputs:
      refresh_decks:
        description: "Redownload all cached Moxfield deck data"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "0 6 * * 1"
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  group: update-value-vintage-metagame
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore Moxfield and Scryfall cache
        uses: actions/cache@v4
        with:
          path: |
            data/decklists_raw
            data/card_cache.json
          key: vv-deck-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            vv-deck-cache-${{ runner.os }}-

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build 90-day metagame data
        env:
          MOXFIELD_BEARER_TOKEN: ${{ secrets.MOXFIELD_BEARER_TOKEN }}
        shell: bash
        run: |
          EXTRA_ARGS=()

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.refresh_decks }}" == "true" ]]; then
            EXTRA_ARGS+=(--refresh-decks)
          fi

          python build_data.py --days 90 "${EXTRA_ARGS[@]}"

      - name: Validate generated app data
        run: |
          python scripts/validate_app_data.py

      - name: Show generated-data summary
        run: |
          python scripts/summarize_app_data.py

      - name: Commit updated metagame data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app_data/ \
            data/vv_online_results.csv \
            data/decks_normalized.json \
            data/deck_cards.csv \
            data/deck_fetch_failures.csv \
            data/clustering/

          if git diff --cached --quiet; then
            echo "No metagame data changes to commit."
            exit 0
          fi

          git commit -m "Update Value Vintage metagame data"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
